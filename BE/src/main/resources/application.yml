spring:
  application:
    name: troday-backend
  sql:
    init:
      mode: never
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    default-property-inclusion: always

app:
  auth:
    secret: ${AUTH_SECRET:}
    access-ttl: ${AUTH_ACCESS_TTL:15m}
    refresh-ttl: ${AUTH_REFRESH_TTL:30d}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173}
    login-limit: ${AUTH_LOGIN_LIMIT:10}
    ip-limit: ${AUTH_IP_LIMIT:30}
    rate-window: ${AUTH_RATE_WINDOW:15m}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
