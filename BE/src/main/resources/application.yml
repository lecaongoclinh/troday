spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: troday-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/room_rental_v5_20261023?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: ${PORT:8081}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:8082,http://127.0.0.1:8082}
