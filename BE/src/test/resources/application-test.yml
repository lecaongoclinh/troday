# Smoke tests load Spring without a database. SQL integration tests need
# a separate MySQL test profile and database when those tests are implemented.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
app:
  auth:
    secret: test-only-secret-never-use-in-production-123456789
debug: false
logging:
  level:
    root: WARN
