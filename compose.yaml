# Development/demo stack. Database initialization runs only on an empty volume.
name: ${COMPOSE_PROJECT_NAME:-troday-dev}
services:
  db:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    environment:
      MYSQL_DATABASE: troday
      MYSQL_USER: ${MYSQL_USER:?Copy .env.example to .env first}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    command:
      - --log-bin-trust-function-creators=1
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1 FROM users LIMIT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: BE/Dockerfile
    environment:
      DB_URL: jdbc:mysql://db:3306/troday?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:?Copy .env.example to .env first}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      PORT: 8081
      TZ: UTC
      FILE_STORAGE_ROOT: /app/uploads
      FILE_SIGNING_SECRET: ${FILE_SIGNING_SECRET:-troday-local-demo-file-signing-secret-change-before-public-use}
      VERIFICATION_DELIVERY_URL: ${VERIFICATION_DELIVERY_URL:-}
      VERIFICATION_DELIVERY_TOKEN: ${VERIFICATION_DELIVERY_TOKEN:-}
      PAPER_IMPORT_USER_IDS: ${PAPER_IMPORT_USER_IDS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:8082,http://127.0.0.1:8082}
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads
    ports:
      - "${API_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://127.0.0.1:8081/api/v1/posts]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: FE_Web/Dockerfile
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  uploads:
